[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "regional-sim"
version = "0.1.0"
description = "An event-driven multi-domain synthetic metropolitan socioeconomic simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
[project.scripts]
regional-sim = "regional_sim.cli:main"
[tool.setuptools.packages.find]
include = ["regional_sim*"]
